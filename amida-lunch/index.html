<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あみだランチ</title><style>*{box-sizing:border-box}body{margin:0;background:#fff3e7;color:#292536;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:520px;margin:auto;padding:24px 16px 50px}h1{text-align:center;font-size:34px;margin:15px 0 2px}.sub{text-align:center;color:#796d79;font-size:13px;margin:0 0 22px}.panel{background:white;border-radius:24px;padding:20px;margin-bottom:16px}h2{font-size:17px;margin:0 0 16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:2px solid #eae2e9;border-radius:13px;padding:13px 8px;display:flex;gap:8px;align-items:center;font-weight:650;font-size:14px}.choice:has(input:checked){border-color:#ef7292;background:#fff1f6}input[type=checkbox]{accent-color:#ef4d79;width:19px;height:19px}button{border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:750;cursor:pointer}button.primary{background:#2b2639;color:white;width:100%;margin-top:15px}button:disabled{opacity:.4}.add{display:flex;gap:8px;margin-top:12px}.add input{min-width:0;flex:1;border:2px solid #eae2e9;border-radius:12px;padding:10px;font-size:16px}.add button{background:#f1e6ec;color:#0786ef}small{color:#827785}.game{text-align:center}svg{width:100%;display:block;overflow:visible}.result{min-height:65px;padding:12px}.result strong{display:block;font-size:27px}.buttons{display:flex;gap:8px}.buttons button{flex:1;background:#eee7ed}.buttons button:first-child{background:#2b2639;color:white}.hint{font-size:13px;color:#817481}#trace{stroke:#f44b7c;stroke-width:7;fill:none;stroke-linejoin:round;stroke-linecap:round}#dot{fill:#ffdb48;stroke:#f44b7c;stroke-width:3}</style><main><h1>🍜 あみだランチ</h1><p class="sub">たかがランチに、やたら複雑な運命。</p><section class="panel"><h2>① 今日の候補をチェック</h2><div class="choices" id="choices"><label class="choice"><input type="checkbox" checked>ラーメン</label><label class="choice"><input type="checkbox" checked>カレー</label><label class="choice"><input type="checkbox" checked>そば</label><label class="choice"><input type="checkbox">うどん</label><label class="choice"><input type="checkbox" checked>定食</label><label class="choice"><input type="checkbox">寿司</label><label class="choice"><input type="checkbox">パスタ</label><label class="choice"><input type="checkbox">ハンバーガー</label><label class="choice"><input type="checkbox">焼肉</label><label class="choice"><input type="checkbox">中華</label><label class="choice"><input type="checkbox">丼もの</label><label class="choice"><input type="checkbox">パン</label></div><div class="add"><input id="new" placeholder="候補を追加"><button id="add">追加</button></div><button class="primary" id="make">あみだを作る！</button><p class="hint" id="hint">2〜8個選んでください。</p></section><section class="panel game" id="game"><h2>② 好きな番号をタップ！</h2><svg id="board" viewBox="0 0 360 625"><text x="180" y="290" text-anchor="middle">あみだを作る！を押してください</text></svg><p class="hint" id="instruction">上のボタンで作成してください</p><div class="result" id="result"></div><div class="buttons"><button id="again">もう一回！</button><button id="back">候補に戻る</button></div></section></main><script>
const S='http://www.w3.org/2000/svg',svg=document.querySelector('#board'),xs=[],colors=['#f45378','#0eb4bd','#f4b438','#9064d9','#3ba67a','#ef7a3d','#3888d9','#c35db1'];let bars=[],loops=[],items=[],busy=false,raf=0;
function node(tag,attrs={},txt){let n=document.createElementNS(S,tag);for(let k in attrs)n.setAttribute(k,attrs[k]);if(txt!==undefined)n.textContent=txt;return n}
function chosen(){return [...document.querySelectorAll('#choices input:checked')].map(x=>x.parentElement.textContent.trim())}
function update(){let n=chosen().length;document.querySelector('#hint').textContent=n+'個選択中（2〜8個）';document.querySelector('#make').disabled=n<2||n>8}
document.querySelector('#choices').addEventListener('change',e=>{if(chosen().length>8)e.target.checked=false;update()});
document.querySelector('#add').onclick=()=>{let input=document.querySelector('#new'),v=input.value.trim();if(!v)return;let label=document.createElement('label');label.className='choice';let check=document.createElement('input');check.type='checkbox';label.append(check,document.createTextNode(v));document.querySelector('#choices').append(label);input.value='';update()};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function make(){if(busy)return;items=shuffle(chosen());if(items.length<2||items.length>8)return;let n=items.length;xs=Array.from({length:n},(_,i)=>26+i*308/(n-1));bars=[];loops=[];let count=54+(n-4)*10;for(let i=0;i<count;i++){let segment=Math.floor(Math.random()*(n-1));let y=67+i*470/count;let b={c:segment,y:y};bars.push(b);if(i%7===3)loops.push({...b,r:11})}draw();document.querySelector('#result').textContent='';document.querySelector('#instruction').textContent='番号を選ぶと光が進みます！';document.querySelector('#game').scrollIntoView({behavior:'smooth',block:'start'})}
function bridgePoints(b){let left=xs[b.c],right=xs[b.c+1],p=[[left,b.y]];if(loops.some(l=>l.y===b.y&&l.c===b.c)){let steps=100,turns=2.25;for(let j=1;j<=steps;j++){let t=j/steps,angle=t*turns*2*Math.PI;let x=left+(right-left)*t;let y=b.y+Math.min(12,32/(xs.length-1))*Math.sin(angle)*Math.sin(Math.PI*t);p.push([x,y])}}p.push([right,b.y]);return p}
function draw(){svg.replaceChildren();svg.setAttribute('viewBox','0 0 360 660');for(let x of xs)svg.append(node('line',{x1:x,y1:45,x2:x,y2:548,stroke:'#67616b','stroke-width':3}));for(let b of bars){let p=bridgePoints(b);svg.append(node('polyline',{points:p.map(v=>v.join(',')).join(' '),fill:'none',stroke:'#67616b','stroke-width':2.7,'stroke-linejoin':'round','stroke-linecap':'round'}))}for(let i=0;i<items.length;i++){let g=node('g',{style:'cursor:pointer'});g.append(node('circle',{cx:xs[i],cy:23,r:items.length>5?14:20,fill:colors[i],stroke:'white','stroke-width':3}),node('text',{x:xs[i],y:29,'text-anchor':'middle',fill:'white','font-weight':800,'font-size':items.length>5?12:17},String(i+1)));g.addEventListener('click',()=>trace(i));svg.append(g);let t=node('text',{x:xs[i],y:581,'text-anchor':'middle',fill:'#292536','font-weight':700,'font-size':items.length>5?10:(items[i].length>6?10:13)},items[i]);if(items.length>5)t.setAttribute('transform','rotate(-55 '+xs[i]+' 581)');svg.append(t)}svg.append(node('path',{id:'trace'}),node('circle',{id:'dot',cx:-20,cy:-20,r:7}))}
function route(start){let c=start,p=[[xs[c],45]];for(let b of bars){p.push([xs[c],b.y]);let old=c;if(b.c===c)c++;else if(b.c===c-1)c--;if(old!==c){let bridge=bridgePoints(b);if(old>c)bridge.reverse();p.push(...bridge.slice(1))}}p.push([xs[c],548]);return {p,end:c}}
function trace(i){if(busy||!items.length)return;busy=true;let {p,end}=route(i),cum=[0];for(let j=1;j<p.length;j++)cum.push(cum[j-1]+Math.hypot(p[j][0]-p[j-1][0],p[j][1]-p[j-1][1]));let total=cum.at(-1),start=performance.now(),line=document.querySelector('#trace'),dot=document.querySelector('#dot');document.querySelector('#result').textContent='';document.querySelector('#instruction').textContent='ぐるぐる、ぐるぐる……';function frame(now){let t=Math.min((now-start)/5500,1),dist=t*total,j=1;while(j<cum.length-1&&cum[j]<dist)j++;let f=(dist-cum[j-1])/(cum[j]-cum[j-1]||1),x=p[j-1][0]+(p[j][0]-p[j-1][0])*f,y=p[j-1][1]+(p[j][1]-p[j-1][1])*f,pts=p.slice(0,j).concat([[x,y]]);line.setAttribute('d','M '+pts.map(v=>v.join(',')).join(' L '));dot.setAttribute('cx',x);dot.setAttribute('cy',y);if(t<1)raf=requestAnimationFrame(frame);else{busy=false;document.querySelector('#instruction').textContent='運命が決まりました！';let r=document.querySelector('#result');r.replaceChildren(node('span',{},'今日のランチは……'));let strong=document.createElement('strong');strong.textContent='🎉 '+items[end]+'！';r.append(strong)}}raf=requestAnimationFrame(frame)}
document.querySelector('#make').onclick=make;document.querySelector('#again').onclick=make;document.querySelector('#back').onclick=()=>document.querySelector('main').scrollIntoView({behavior:'smooth'});update();
</script></html>
